[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "avenir-hku-public-research-framework"
version = "0.1.0"
description = "Disclosed XGBoost research code with a confidential trading-strategy boundary"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
authors = [{ name = "SmartR168" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
model = ["xgboost>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/public_framework"]
