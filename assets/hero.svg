<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">Cross-Sectional Alpha with Regime-Aware EWMAC and Dynamic Grid</title>
  <desc id="desc">Research showcase for the Avenir-HKU Web3.0 Quantitative Trading Challenge 2025, global rank 14 of 128, with author-reported historical backtest results.</desc>
  <defs>
